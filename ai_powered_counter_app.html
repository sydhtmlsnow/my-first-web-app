<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .count-anim {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease-out;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 select-none">

  <!-- Main Container Card -->
  <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center justify-between gap-6">
    
    <!-- Header Badge -->
    <div class="flex items-center gap-2 bg-indigo-950/80 border border-indigo-500/30 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full">
      <svg class="w-3.5 h-3.5 fill-indigo-400" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
      <span>Gemini AI Enhanced Counter</span>
    </div>

    <!-- Display area for the counter number -->
    <div class="flex flex-col items-center justify-center min-h-[100px] w-full">
      <span id="counter" class="count-anim text-7xl sm:text-8xl font-extrabold tracking-tight text-white drop-shadow-md">
        0
      </span>
    </div>

    <!-- Button Controls: Plus & Minus -->
    <div class="flex items-center justify-between w-full gap-4">
      <!-- Minus Button -->
      <button 
        id="btn-minus"
        aria-label="Decrease count"
        class="w-full aspect-square max-w-[90px] flex items-center justify-center text-4xl font-semibold bg-slate-800 hover:bg-slate-700 active:bg-slate-600 active:scale-95 text-slate-200 hover:text-white rounded-2xl border border-slate-700/60 transition-all duration-150 shadow-lg focus:outline-none focus:ring-2 focus:ring-slate-500 cursor-pointer"
      >
        &#8722;
      </button>

      <!-- Plus Button -->
      <button 
        id="btn-plus"
        aria-label="Increase count"
        class="w-full aspect-square max-w-[90px] flex items-center justify-center text-4xl font-semibold bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 active:scale-95 text-white rounded-2xl border border-indigo-500/50 transition-all duration-150 shadow-lg shadow-indigo-950/50 focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer"
      >
        &#43;
      </button>
    </div>

    <!-- AI Features Section -->
    <div class="w-full border-t border-slate-800/80 pt-5 flex flex-col gap-4">
      
      <!-- Natural Language Math Input -->
      <form id="nl-form" class="flex gap-2 w-full">
        <input 
          type="text" 
          id="nl-input" 
          placeholder="e.g., 'Add 3 coffees' or 'half of 20'" 
          class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
        />
        <button 
          type="submit" 
          id="nl-btn"
          class="bg-slate-800 hover:bg-slate-700 text-xs font-semibold px-3 py-2 rounded-xl text-slate-200 border border-slate-700/50 whitespace-nowrap transition-colors"
        >
          Ask AI
        </button>
      </form>

      <!-- AI Action Buttons -->
      <div class="flex items-center justify-center gap-2 text-xs">
        <button id="btn-ai-fact" class="flex-1 py-2 px-3 bg-slate-800/70 hover:bg-slate-800 border border-slate-700/50 rounded-xl text-slate-300 font-medium transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Fact</span>
        </button>

        <button id="btn-ai-speech" class="flex-1 py-2 px-3 bg-slate-800/70 hover:bg-slate-800 border border-slate-700/50 rounded-xl text-slate-300 font-medium transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
          <span>Speak</span>
        </button>

        <button id="btn-ai-image" class="flex-1 py-2 px-3 bg-slate-800/70 hover:bg-slate-800 border border-slate-700/50 rounded-xl text-slate-300 font-medium transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span>Visualize</span>
        </button>
      </div>

      <!-- AI Response Output Display -->
      <div id="ai-output" class="hidden bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5 text-xs text-slate-300 flex flex-col gap-2 fade-in">
        <div id="ai-status" class="text-indigo-400 font-semibold text-[11px] uppercase tracking-wider flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
          <span>AI Thinking...</span>
        </div>
        <p id="ai-text" class="leading-relaxed text-slate-200"></p>
        <div id="ai-image-container" class="hidden mt-1 rounded-xl overflow-hidden border border-slate-800">
          <img id="ai-image" class="w-full h-auto object-cover max-h-48" alt="AI Generated visualization" />
        </div>
      </div>

    </div>

  </main>

  <script>
    // State variable
    let count = 0;
    let isFetchingAI = false;

    // DOM Elements
    const counterEl = document.getElementById('counter');
    const btnMinus = document.getElementById('btn-minus');
    const btnPlus = document.getElementById('btn-plus');

    const nlForm = document.getElementById('nl-form');
    const nlInput = document.getElementById('nl-input');
    const btnAiFact = document.getElementById('btn-ai-fact');
    const btnAiSpeech = document.getElementById('btn-ai-speech');
    const btnAiImage = document.getElementById('btn-ai-image');

    const aiOutput = document.getElementById('ai-output');
    const aiStatus = document.getElementById('ai-status');
    const aiText = document.getElementById('ai-text');
    const aiImageContainer = document.getElementById('ai-image-container');
    const aiImage = document.getElementById('ai-image');

    /**
     * Updates the UI with the current count value and applies a pulse animation
     */
    function updateCounter(delta) {
      count += delta;

      // Animate out slightly
      counterEl.style.transform = 'scale(0.9)';
      counterEl.style.opacity = '0.7';

      setTimeout(() => {
        counterEl.textContent = count;
        // Animate back in
        counterEl.style.transform = 'scale(1)';
        counterEl.style.opacity = '1';
      }, 50);
    }

    // Event listeners for user interaction
    btnMinus.addEventListener('click', () => updateCounter(-1));
    btnPlus.addEventListener('click', () => updateCounter(1));

    // Keyboard support for accessibility (+ / - or Up / Down arrow keys)
    document.addEventListener('keydown', (e) => {
      // Don't trigger standard keybindings if user is typing in input
      if (document.activeElement === nlInput) return;

      if (e.key === '+' || e.key === 'ArrowUp' || e.key === '=') {
        updateCounter(1);
      } else if (e.key === '-' || e.key === 'ArrowDown') {
        updateCounter(-1);
      }
    });

    async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return await response.json();
        } catch (e) {
          if (i === retries - 1) throw e;
        }
        await new Promise(res => setTimeout(res, backoff * Math.pow(2, i)));
      }
      throw new Error('API Request Failed after retries');
    }

    function showAIOutput(statusTitle) {
      aiOutput.classList.remove('hidden');
      aiStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span><span>${statusTitle}</span>`;
      aiText.textContent = "Generating response...";
      aiImageContainer.classList.add('hidden');
    }

    async function generateNumberFact() {
      if (isFetchingAI) return;
      isFetchingAI = true;
      showAIOutput("Gemini Fact Generator");

      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        const payload = {
          contents: [{
            parts: [{ text: `Give me 1 energetic, interesting, or clever trivia fact or math property about the number ${count}. Keep it under 20 words.` }]
          }],
          systemInstruction: {
            parts: [{ text: "You are a witty, enthusiastic math and trivia assistant." }]
          }
        };

        const result = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const factText = result.candidates?.[0]?.content?.parts?.[0]?.text || `The number ${count} is truly legendary!`;
        aiText.textContent = factText;
      } catch (err) {
        aiText.textContent = "Could not fetch AI fact at the moment. Please try again!";
      } finally {
        isFetchingAI = false;
      }
    }

    nlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userQuery = nlInput.value.trim();
      if (!userQuery || isFetchingAI) return;

      isFetchingAI = true;
      showAIOutput("Understanding Command...");

      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{
            parts: [{ text: `Current count is ${count}. User command: "${userQuery}". Calculate the new total or change needed.` }]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                "newCount": { "type": "INTEGER", "description": "The updated final count value after applying the request." },
                "explanation": { "type": "STRING", "description": "Short 1-sentence explanation of the calculation." }
              },
              required: ["newCount", "explanation"]
            }
          }
        };

        const result = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (jsonText) {
          const data = JSON.parse(jsonText);
          const delta = data.newCount - count;
          updateCounter(delta);
          aiText.textContent = data.explanation;
          nlInput.value = '';
        } else {
          aiText.textContent = "Sorry, couldn't parse that command.";
        }
      } catch (err) {
        aiText.textContent = "Error processing command.";
      } finally {
        isFetchingAI = false;
      }
    });

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function pcmToWav(pcm16, sampleRate) {
      const numChannels = 1;
      const dataSize = pcm16.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      const pcmView = new Int16Array(buffer, 44, pcm16.length);
      pcmView.set(pcm16);

      return new Blob([buffer], { type: 'audio/wav' });
    }

    async function speakNumber() {
      if (isFetchingAI) return;
      isFetchingAI = true;
      showAIOutput("Gemini Voice TTS");

      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{
            parts: [{ text: `Say enthusiastically: Your current counter is at ${count}!` }]
          }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
            }
          }
        };

        const result = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const part = result?.candidates?.[0]?.content?.parts?.[0];
        const audioData = part?.inlineData?.data;
        const mimeType = part?.inlineData?.mimeType || '';

        if (audioData) {
          const sampleRateMatch = mimeType.match(/rate=(\d+)/);
          const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
          
          const pcmBuffer = base64ToArrayBuffer(audioData);
          const pcm16 = new Int16Array(pcmBuffer);
          const wavBlob = pcmToWav(pcm16, sampleRate);
          const audioUrl = URL.createObjectURL(wavBlob);
          
          const audio = new Audio(audioUrl);
          audio.play();
          aiText.textContent = `🔊 Playing spoken readout for counter value ${count}!`;
        } else {
          aiText.textContent = "Audio generation returned no sound.";
        }
      } catch (err) {
        aiText.textContent = "Could not play voice output.";
      } finally {
        isFetchingAI = false;
      }
    }

    async function visualizeNumber() {
      if (isFetchingAI) return;
      isFetchingAI = true;
      showAIOutput("Generating Artwork...");

      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{
            parts: [{ text: `A vibrant digital art illustration visually depicting ${count} items or glowing magical objects representing the number ${count}` }]
          }],
          generationConfig: {
            responseModalities: ['TEXT', 'IMAGE']
          }
        };

        const result = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const imagePart = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
        if (imagePart && imagePart.inlineData) {
          const imageUrl = `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;
          aiImage.src = imageUrl;
          aiImageContainer.classList.remove('hidden');
          aiText.textContent = `Visual representation for number ${count}`;
        } else {
          aiText.textContent = "Could not generate image visualization.";
        }
      } catch (err) {
        aiText.textContent = "Failed to render AI image.";
      } finally {
        isFetchingAI = false;
      }
    }

    // Attach AI Button Handlers
    btnAiFact.addEventListener('click', generateNumberFact);
    btnAiSpeech.addEventListener('click', speakNumber);
    btnAiImage.addEventListener('click', visualizeNumber);
  </script>
</body>
</html>
